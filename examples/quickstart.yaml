run:
  mode: shadow
  model: local-stub
  budget:
    max_steps: 25
    max_tokens:
    max_wall_time_seconds: 900

discovery:
  candidates:
    - owner: openai
      repo: openai-agents-python
      url: https://github.com/openai/openai-agents-python
      branch: main
      notes: Example M0.0 candidate.

workspace:
  backend: docker
  image: contribarena/workspace:latest
  workdir: /workspace
  command_timeout_seconds: 300
  resources:
    cpus: "2"
    memory: 4g
    disk: 10g

artifacts:
  output_root: runs

models:
  providers:
    compatible: {}
