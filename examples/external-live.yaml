run:
  mode: external_live
  model: compatible/example-gpt
  budget:
    max_steps: 50
    max_tokens:
    max_wall_time_seconds: 2400

discovery:
  query: "language:Python stars:>=50 pushed:>2026-01-01"
  filters:
    language: Python
    stars_min: 50
    pushed_after: "2026-01-01"

workspace:
  backend: docker
  image: contribarena/workspace:latest
  workdir: /workspace
  command_timeout_seconds: 300
  cleanup_policy: retain_on_failure
  resources:
    cpus: "2"
    memory: 4g
    disk: 10g

artifacts:
  output_root: runs

controller:
  # Run this config repeatedly from an external scheduler for lifecycle polling.
  # One invocation performs either one due lifecycle tick or one new external run.
  enabled: true
  interval_seconds: 21600
  max_ticks: 1

governance:
  # Keep false in committed examples. Set true only in a local copy with a dedicated bot token.
  live_enabled: false
  owned_repositories: []
  bot_identity:
    kind: pat
    actor: YOUR_BOT_ACTOR
    token_env: GITHUB_TOKEN
  rate_limits:
    max_open_prs_per_repo: 1
    max_prs_per_repo_per_day: 1
    min_minutes_between_prs_per_repo: 1440
    max_open_prs_per_org: 1
    max_prs_per_org_per_day: 1
    min_minutes_between_prs_per_org: 1440
    max_open_prs_global: 2
    max_prs_global_per_day: 1
    min_minutes_between_prs_global: 360
  contribution_classes:
    allowed:
      - docs
      - tests
      - low_risk_code
  kill_switches:
    global: false
    repositories: []
    organizations: []
    agents: []
  external_live:
    poll_interval_seconds: 21600
    require_maintainer_fit: true
    require_spam_risk_review: true
    allow_public_comments: true

models:
  providers:
    compatible:
      example-gpt:
        base_url_env: CONTRIBARENA_CHAT_BASE_URL
        api_key_env: CONTRIBARENA_EXAMPLE_API_KEY
        model: your-model-name
