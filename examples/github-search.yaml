run:
  mode: shadow
  model: local-stub
  budget:
    max_steps: 80
    max_tokens:
    max_wall_time_seconds: 3600

discovery:
  query: agent framework
  filters:
    language: Python
    stars_min: 50
    pushed_after: "2026-01-01"

workspace:
  backend: docker
  image: contribarena/workspace:latest
  workdir: /workspace
  command_timeout_seconds: 900
  resources:
    cpus: "2"
    memory: 4g
    disk: 10g

artifacts:
  output_root: runs

models:
  providers:
    compatible: {}
